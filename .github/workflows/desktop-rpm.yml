name: Desktop Smoke / RPM

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
      release_date:
        required: false
        default: ""
        type: string
      revision:
        required: false
        default: "0"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PILOTDECK_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    name: Rocky Linux 9 ${{ matrix.arch }} RPM build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rpm_arch: x86_64
            unpacked_dir: linux-unpacked
            runner: ubuntu-22.04
          - arch: arm64
            rpm_arch: aarch64
            unpacked_dir: linux-arm64-unpacked
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    container: rockylinux:9
    timeout-minutes: 90
    env:
      PILOTDECK_RELEASE_DATE: ${{ inputs.release_date }}
      PILOTDECK_RELEASE_REVISION: ${{ inputs.revision }}
      PILOTDECK_COMMIT_SHA: ${{ inputs.source_sha }}
      PILOTDECK_DESKTOP_NODE_ARCH: ${{ matrix.arch }}
      USE_SYSTEM_FPM: "true"
      NODE_OPTIONS: --max-old-space-size=2560
    steps:
      - name: Bootstrap container tools
        run: dnf install -y git tar gzip xz which findutils
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install RPM build tools
        run: bash apps/desktop/scripts/install-rpm-build-deps.sh
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Verify Rocky Linux 9 build baseline
        run: node apps/desktop/scripts/check-linux-build-host.mjs ${{ matrix.arch }} rpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Set desktop release metadata
        run: node apps/desktop/scripts/set-ci-version.mjs
      - name: Build RPM
        run: pnpm --filter pilotdeck-desktop run dist:linux:rpm:${{ matrix.arch }}
      - name: Verify RPM architecture, updater and baseline installation
        shell: bash
        run: |
          set -euo pipefail
          rpm_path="$(find apps/desktop/dist-electron -maxdepth 1 -name '*-linux-${{ matrix.arch }}.rpm' -print -quit)"
          test -n "$rpm_path"
          test "$(rpm -qp --qf '%{ARCH}' "$rpm_path")" = '${{ matrix.rpm_arch }}'
          feed=latest-rpm-linux.yml
          if [ '${{ matrix.arch }}' = arm64 ]; then feed=latest-rpm-linux-arm64.yml; fi
          test -s "apps/desktop/dist-electron/$feed"
          grep -Fq "$(basename "$rpm_path")" "apps/desktop/dist-electron/$feed"
          test "$(cat apps/desktop/dist-electron/${{ matrix.unpacked_dir }}/resources/package-type)" = rpm
          dnf install -y "$rpm_path"
          desktop-file-validate /usr/share/applications/pilotdeck-desktop.desktop
          /opt/PilotDeck/resources/node/bin/node apps/desktop/scripts/verify-linux-package.cjs '${{ matrix.arch }}' rpm
          ELECTRON_RUN_AS_NODE=1 /opt/PilotDeck/pilotdeck-desktop apps/desktop/scripts/verify-updater.cjs /opt/PilotDeck/resources/app.asar
      - name: Upload RPM installer and feed
        uses: actions/upload-artifact@v7
        with:
          name: pilotdeck-desktop-rpm-${{ matrix.arch }}
          path: |
            apps/desktop/dist-electron/*-linux-${{ matrix.arch }}.rpm
            apps/desktop/dist-electron/latest-rpm-linux*.yml
          if-no-files-found: error
          retention-days: 14

  fedora-smoke:
    name: Fedora 44 ${{ matrix.arch }} installed RPM smoke
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install test tools
        run: dnf install -y git tar gzip desktop-file-utils dbus-x11 xorg-x11-server-Xvfb xorg-x11-xauth xwininfo weston
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: pilotdeck-desktop-rpm-${{ matrix.arch }}
          path: rpm-assets
      - name: Install RPM and exercise native modules
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y rpm-assets/*.rpm
          desktop-file-validate /usr/share/applications/pilotdeck-desktop.desktop
          /opt/PilotDeck/resources/node/bin/node apps/desktop/scripts/verify-linux-package.cjs '${{ matrix.arch }}' rpm
      - name: Smoke installed app under X11
        run: bash apps/desktop/scripts/run-linux-display-smoke.sh x11
      - name: Smoke installed app under Wayland
        run: bash apps/desktop/scripts/run-linux-display-smoke.sh wayland
