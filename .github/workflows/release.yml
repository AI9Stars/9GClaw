name: Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PILOTDECK_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release_date: ${{ steps.detect.outputs.release_date }}
      revision: ${{ steps.detect.outputs.revision }}
      source_sha: ${{ steps.detect.outputs.source_sha }}
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must run from the main branch, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - name: Read the original manual run start time
        id: started
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Allocate the Shanghai date and next release revision
        id: detect
        shell: bash
        env:
          FORCE_RELEASE: "true"
          PILOTDECK_RELEASE_STARTED_AT: ${{ steps.started.outputs.started_at }}
        run: node apps/desktop/scripts/detect-release.mjs

  windows:
    name: Windows
    needs: detect
    uses: ./.github/workflows/desktop-windows.yml
    with:
      release_date: ${{ needs.detect.outputs.release_date }}
      revision: ${{ needs.detect.outputs.revision }}

  release:
    permissions:
      contents: write
    needs: [detect, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - uses: actions/download-artifact@v8
        with:
          pattern: pilotdeck-desktop-windows-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release metadata
        id: metadata
        env:
          PILOTDECK_RELEASE_DATE: ${{ needs.detect.outputs.release_date }}
          PILOTDECK_RELEASE_REVISION: ${{ needs.detect.outputs.revision }}
          PILOTDECK_COMMIT_SHA: ${{ needs.detect.outputs.source_sha }}
        run: node apps/desktop/scripts/set-ci-version.mjs

      - name: Create release manifest and checksums
        env:
          PILOTDECK_RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          PILOTDECK_RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          PILOTDECK_RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
          PILOTDECK_COMMIT_SHA: ${{ needs.detect.outputs.source_sha }}
        run: node apps/desktop/scripts/create-release-manifest.mjs release-assets

      - name: Verify both Windows installers and updater feeds
        run: node apps/desktop/scripts/verify-release-assets.mjs release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" \
            --latest \
            --generate-notes
